name: Security and Community Health
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

# DCO is enforced by the DCO GitHub App, and CodeQL runs via code scanning
# default setup (which rejects uploads from advanced workflows), so neither
# is duplicated here.
jobs:
  dependency-review:
    name: Security Hardening
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  stale:
    name: Manage Stale Issues
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Manage Stale Issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity.'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'good first issue,help wanted,security'
