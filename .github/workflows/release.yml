name: Release

# Pushes verify and version the package, then submit pending previews to npm's
# staging area. Maintainers approve the staged package on npm with 2FA.
# A manual run then verifies the public tarball and finishes the GitHub release.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Full commit SHA from the staging summary, after approval on npm'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Verify and version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.state.outputs.publish }}
    env:
      # The `secrets` context is not available in a step-level `if`. Referencing
      # it there is a workflow syntax error rather than a falsy condition, and it
      # fails the whole file at startup - including the branch filters, so the
      # run fires on branches `on:` excludes. Job-level `env` may read secrets and
      # step-level `if` may read `env`, so the guard goes through here.
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tegami reads commits back to the latest tag, so a shallow clone would
          # see no history and release nothing.
          fetch-depth: 0
          # Tegami pushes with the App token supplied to the version step.
          # Persisting checkout's default token can override those credentials.
          persist-credentials: false

      # Work the version PR as the GitHub App rather than as the built-in
      # GITHUB_TOKEN. Anything GITHUB_TOKEN does is barred from triggering
      # another workflow run, so a version PR it opened would get no CI, and a
      # merge it performed would never start the publish job. An App token has
      # no such restriction, which is what closes the loop.
      #
      # Skipped until the secrets exist; every step below then falls back to
      # github.token and the release still runs, just needing a nudge to publish.
      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Tegami requires Node 24+.
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Runs before either outcome, so a version PR is never opened from a broken
      # tree and the publish job never starts from one.
      - name: Verify
        run: npm run ci

      - name: Is a publish owed?
        id: state
        # release:check prints the publish status; if it fails, this step fails
        # (the default shell runs with -e -o pipefail) rather than being read
        # as "nothing to publish".
        run: |
          status=$(npm run release:check --silent | tail -n 1)
          echo "Publish status: $status"
          if [ "$status" = "pending" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.state.outputs.publish == 'false'
        run: npm run release:version
        env:
          # Opening the PR as the App is what lets CI run on it, so the
          # --auto merge below has real checks to wait for.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # Turn on auto-merge for the version PR so a release needs no second click.
      # Set the repository variable AUTO_MERGE_RELEASE to "false" to review every
      # bump by hand instead.
      - name: Enable auto-merge on the version PR
        if: steps.state.outputs.publish == 'false' && vars.AUTO_MERGE_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          pr=$(gh pr list --head tegami/version-packages --base "${GITHUB_REF_NAME}" \
                 --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open version PR; nothing to auto-merge."
            exit 0
          fi
          # Repository auto-merge must be enabled. Surface configuration or
          # permission failures rather than falling back to an immediate merge.
          gh pr merge "$pr" --squash --auto

  stage:
    name: Stage preview on npm
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Matches the npm Trusted Publisher. Restrict this environment to main;
    # final publication approval happens on npm, so staging needs no reviewer.
    environment: release
    permissions:
      contents: read
      # This publisher can stage only. There is no NPM_TOKEN.
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14.0; Tegami needs 24+. No
          # registry-url: an .npmrc with a token would make npm authenticate with
          # that token instead of the OIDC exchange.
          node-version: '24'
          cache: npm

      # setup-node ships the npm bundled with Node; trusted publishing needs
      # npm >= 11.5.1. Without this the publish falls back to token auth - and
      # there is no token - so it fails at the last step.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12.1.0
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Validate release package
        run: npm run ci

      - name: Stage for maintainer approval on npm
        run: npm run release:stage
        env:
          # npm otherwise hides a rejected OIDC exchange behind ENEEDAUTH.
          NPM_CONFIG_LOGLEVEL: verbose

  finalize:
    name: Finalize approved npm preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No npm credentials or OIDC permission: this job only verifies publication
    # and writes GitHub metadata after the maintainer's approval on npm.
    permissions:
      contents: write
    steps:
      - name: Checkout main and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the exact staged commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit must be the full SHA from the staging summary."
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Use the same npm pack implementation as staging
        run: npm install -g npm@12.1.0

      - name: Install Dependencies
        run: npm ci

      - name: Validate release package
        run: npm run ci

      - name: Verify npm approval and finalize GitHub release
        run: npm run release:finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
